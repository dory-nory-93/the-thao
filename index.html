<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THAO 24H - Bóng Đá, Thể Thao, Tin Tức, Tài Chính</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f5f5;color:#111}
header{background:#e11d2e;color:#fff;text-align:center;padding:22px 12px 18px;position:sticky;top:0;z-index:10}
header h1{font-size:32px;letter-spacing:1px}
header p{opacity:.9;margin-top:6px;font-size:15px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff;position:sticky;top:0;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tabs button{border:0;background:#f1f1f1;padding:9px 16px;border-radius:999px;font-size:15px;cursor:pointer;font-weight:600}
.tabs button.active{background:#e11d2e;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:16px 12px 40px}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;gap:0;cursor:pointer;text-decoration:none;color:#111}
.card img{width:260px;object-fit:cover;min-height:160px;background:#ddd}
.card-body{padding:14px;flex:1}
.badge{display:inline-block;background:#e11d2e;color:#fff;font-size:12px;padding:4px 8px;border-radius:999px;margin-bottom:8px}
.card h2{font-size:18px;line-height:1.35;margin-bottom:8px}
.card p{color:#555;font-size:14px;line-height:1.5}
.time{color:#999;font-size:12px;margin-top:8px}
.loading{text-align:center;padding:40px;color:#666}
@media(max-width:640px){.card{flex-direction:column}.card img{width:100%;height:180px}header h1{font-size:26px}}
</style>
</head>
<body>
<header><h1>⚽ THE THAO 24H</h1><p>Bóng Đá • Thể Thao • Tin Tức • Tài Chính - Cập Nhật 24/7</p></header>
<div class="tabs" id="tabs">
<button class="active" data-cat="all">🏠 Tất Cả</button>
<button data-cat="the-thao">🏆 Thể Thao</button>
<button data-cat="bong-da">⚽ Bóng Đá</button>
<button data-cat="tin-tuc">📰 Tin Tức</button>
<button data-cat="tai-chinh">💰 Tài Chính</button>
</div>
<div class="wrap"><div id="list"><div class="loading">Đang tải tin mới nhất...</div></div></div>

<script>
const fallback=[
{cat:"bong-da",title:"Việt Nam thắng kịch tính ở phút cuối, người hâm mộ vỡ òa",desc:"Trận đấu diễn ra căng thẳng đến những phút cuối cùng. Bàn thắng quyết định đã mang về 3 điểm quý giá cho đội tuyển.",img:"https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=600&q=80",time:"18/11/2026 • 2 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"bong-da",title:"Ngoại Hạng Anh: Cuộc đua vô địch nóng hơn bao giờ hết",desc:"Top 4 chỉ cách nhau 2 điểm. Vòng đấu cuối tuần này sẽ quyết định rất nhiều đến ngôi vương mùa này.",img:"https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=600&q=80",time:"18/11/2026 • 3 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"the-thao",title:"Pickleball tiếp tục gây sốt ở Việt Nam, sân chơi mọc lên khắp nơi",desc:"Môn thể thao mới đang thu hút hàng nghìn người chơi mỗi ngày, từ trẻ em đến người lớn tuổi.",img:"https://images.unsplash.com/photo-1554068865-24e4d2c9bc5d?w=600&q=80",time:"18/11/2026 • 4 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"the-thao",title:"SEA Games: Đoàn Việt Nam đặt mục tiêu top 2 toàn đoàn",desc:"Các vận động viên trọng điểm đang bước vào giai đoạn tập luyện nước rút chuẩn bị cho kỳ đại hội sắp tới.",img:"https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&q=80",time:"18/11/2026 • 5 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"tin-tuc",title:"Thời tiết hôm nay: Miền Bắc se lạnh, miền Nam nắng đẹp",desc:"Người dân nên mang theo áo khoác nhẹ khi ra đường vào sáng sớm và tối muộn.",img:"https://images.unsplash.com/photo-1504609813442-a8924e83f76e?w=600&q=80",time:"18/11/2026 • 1 giờ trước",link:"https://the-thao.vercel.app"},
  {cat:"tin-tuc",title:"Giá xăng dầu hôm nay biến động, người dân cần lưu ý",desc:"Giá xăng dầu trong nước được điều chỉnh theo diễn biến giá thế giới trong kỳ điều hành mới nhất.",img:"https://images.unsplash.com/photo-1527018601619-a508a2be00cd?w=600&q=80",time:"18/11/2026 • 2 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"tai-chinh",title:"Giá vàng hôm nay tăng mạnh, lập đỉnh mới",desc:"Giá vàng trong nước và thế giới cùng đi lên do nhu cầu trú ẩn an toàn tăng cao.",img:"https://images.unsplash.com/photo-1610375461246-83df859d849d?w=600&q=80",time:"18/11/2026 • 30 phút trước",link:"https://the-thao.vercel.app"},
{cat:"tai-chinh",title:"Tỷ giá USD hôm nay: Ngân hàng đồng loạt điều chỉnh",desc:"Tỷ giá trung tâm và giá USD tại các ngân hàng thương mại có sự thay đổi nhẹ so với hôm qua.",img:"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600&q=80",time:"18/11/2026 • 1 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"bong-da",title:"Messi lại ghi siêu phẩm, Inter Miami thắng lớn",desc:"Siêu sao người Argentina tiếp tục chứng tỏ đẳng cấp với một pha lập công không thể cản phá.",img:"https://images.unsplash.com/photo-1560272564-c83b66b1ad12?w=600&q=80",time:"18/11/2026 • 6 giờ trước",link:"https://the-thao.vercel.app"},
{cat:"tin-tuc",title:"iPhone mới ra mắt: Có gì đáng để nâng cấp?",desc:"Camera, pin và chip mới là 3 điểm nâng cấp lớn nhất được người dùng quan tâm nhất lần này.",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600&q=80",time:"18/11/2026 • 7 giờ trước",link:"https://the-thao.vercel.app"},
];
let current="all";
function catName(c){return c==="bong-da"?"Bóng Đá":c==="the-thao"?"Thể Thao":c==="tin-tuc"?"Tin Tức":"Tài Chính"}
function render(){
  const list=document.getElementById("list");
  const data=fallback.filter(n=>current==="all"||n.cat===current);
  list.innerHTML=data.map(n=><a class="card" href="${n.link}" target="_blank"><img src="${n.img}"><div class="card-body"><span class="badge">${catName(n.cat)}</span><h2>${n.title}</h2><p>${n.desc}</p><div class="time">${n.time}</div></div></a>).join("");
}
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); current=b.dataset.cat; render();
  }
});
render();
</script>
</body>
</html>
