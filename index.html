<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THAO 24H</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f2f2}
header{background:#e11d2e;color:white;text-align:center;padding:20px}
header h1{font-size:28px}
header p{font-size:14px;opacity:0.9;margin-top:5px}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;background:white;flex-wrap:wrap}
.tabs button{border:none;background:#eee;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#e11d2e;color:white}
.list{max-width:800px;margin:16px auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:12px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-decoration:none;color:#000}
.card img{width:180px;height:120px;object-fit:cover;background:#ddd}
.card div{padding:12px 10px 12px 0}
.tag{color:#e11d2e;font-size:12px;font-weight:bold}
.card h3{font-size:17px;line-height:1.4;margin:6px 0}
.card p{font-size:13px;color:#666;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.time{font-size:12px;color:#999;margin-top:8px}
.loading{text-align:center;padding:40px;color:#666}
@media(max-width:600px){.card img{width:120px;height:90px}}
</style>
</head>
<body>
<header><h1>⚽ THE THAO 24H</h1><p>Bóng Đá • Thể Thao • Tin Tức • Tài Chính - Tự động cập nhật từ VnExpress</p><p id="update" style="font-size:12px;margin-top:6px">Đang tải tin mới nhất...</p></header>
<div class="tabs">
<button class="active" onclick="loc('all',this)">🏠 Tất Cả</button>
<button onclick="loc('BÓNG ĐÁ',this)">⚽ Bóng Đá</button>
<button onclick="loc('THỂ THAO',this)">🏆 Thể Thao</button>
<button onclick="loc('KINH DOANH',this)">💰 Tài Chính</button>
</div>
<div class="list" id="list"><div class="loading">Đang tải tin mới nhất...</div></div>
<script>
let allNews=[];
async function load(){
try{
const feeds=[
'https://vnexpress.net/rss/the-thao.rss',
'https://vnexpress.net/rss/bong-da.rss',
'https://vnexpress.net/rss/kinh-doanh.rss'
];
let items=[];
for(let f of feeds){
try{
const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(f));
const d=await r.json();
d.items.forEach(it=>{
let cat='THỂ THAO';
if(f.includes('bong-da')) cat='BÓNG ĐÁ';
if(f.includes('kinh-doanh')) cat='KINH DOANH';
items.push({title:it.title,desc:it.description.replace(/<[^>]*>/g,'').slice(0,140)+'...',link:it.link,img:it.thumbnailit.enclosure?.link'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600',date:new Date(it.pubDate).toLocaleString('vi-VN'),cat});
});
}catch(e){}
}
if(items.length===0) throw new Error('no news');
items.sort((a,b)=>new Date(b.date)-new Date(a.date));
allNews=items.slice(0,20);
document.getElementById('update').textContent='Cập nhật lúc: '+new Date().toLocaleString('vi-VN')+' • '+allNews.length+' tin mới';
render(allNews);
}catch(e){
document.getElementById('list').innerHTML='<div class="loading">Không tải được tin mới, bạn bấm F5 để thử lại nhé. Tin vẫn lấy từ VnExpress nên sẽ tự cập nhật.</div>';
}
}
function render(list){
document.getElementById('list').innerHTML=list.map(n=><a class="card" data-cat="${n.cat}" href="${n.link}" target="_blank"><img src="${n.img}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600'"><div><div class="tag">${n.cat}</div><h3>${n.title}</h3><p>${n.desc}</p><div class="time">${n.date} • Bấm để đọc →</div></div></a>).join('');
}
function loc(cat,btn){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render(cat==='all'?allNews:allNews.filter(n=>n.cat===cat));
}
load();
setInterval(load, 10*60*1000);
</script>
</body>
</html>
