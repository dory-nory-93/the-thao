<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THAO 24H - Bóng Đá Châu Âu</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:0}
header{background:#d70000;color:white;text-align:center;padding:25px}
header h1{margin:0;font-size:32px}
header p{margin:5px 0 0}
.container{max-width:900px;margin:20px auto;padding:0 15px}
.card{background:white;border-radius:12px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);display:flex;gap:15px;padding:15px}
.card img{width:220px;height:150px;object-fit:cover;border-radius:8px}
.card h3{margin:0 0 8px;font-size:18px}
.card h3 a{color:#111;text-decoration:none}
.card p{color:#555;font-size:14px;line-height:1.5}
.time{color:#d70000;font-size:12px;font-weight:bold}
.btn{display:inline-block;margin-top:8px;background:#d70000;color:white;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px}
#loading{text-align:center;padding:40px}
</style>
</head>
<body>
<header>
<h1>⚽ THE THAO 24H</h1>
<p>Tin Bóng Đá Châu Âu - Tự Động Cập Nhật</p>
<p style="font-size:13px">Nguồn: BBC Sport Football • Cập nhật mỗi khi tải lại trang</p>
</header>

<div class="container">
<div id="loading">Đang tải tin mới nhất... ⏳</div>
<div id="news"></div>
</div>

<script>
async function loadNews(){
  try{
    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/sport/football/rss.xml');
    const data = await res.json();
    let html = '';
    data.items.slice(0,10).forEach(item=>{
      html += <div class="card">
        <img src="${item.thumbnail || 'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=400'}" onerror="this.src='https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=400'">
        <div>
          <div class="time">${new Date(item.pubDate).toLocaleString('vi-VN')} • CHÂU ÂU</div>
          <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
          <p>${item.description.replace(/<[^>]*>/g,'').slice(0,150)}...</p>
          <a class="btn" href="${item.link}" target="_blank">Đọc Chi Tiết →</a>
        </div>
      </div>;
    });
    document.getElementById('news').innerHTML = html;
    document.getElementById('loading').style.display='none';
  }catch(e){
    document.getElementById('loading').innerHTML = 'Không tải được tin, bạn thử tải lại trang (F5) nha.';
  }
}
loadNews();
</script>
</body>
</html>
