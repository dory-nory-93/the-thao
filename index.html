YPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THAO 24H</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f2f2}
header{background:#e11d2e;color:white;text-align:center;padding:20px}
header h1{font-size:28px}
header p{font-size:14px;opacity:0.9;margin-top:5px}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;background:white;flex-wrap:wrap}
.tabs button{border:none;background:#eee;padding:8px 14px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#e11d2e;color:white}
.list{max-width:800px;margin:16px auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:12px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-decoration:none;color:#000}
.card img{width:180px;height:120px;object-fit:cover;background:#ddd}
.card div{padding:12px 10px 12px 0}
.tag{color:#e11d2e;font-size:12px;font-weight:bold}
.card h3{font-size:17px;line-height:1.4;margin:6px 0}
.card p{font-size:13px;color:#666;line-height:1.5}
.time{font-size:12px;color:#999;margin-top:8px}
@media(max-width:600px){.card img{width:120px;height:90px}}
</style>
</head>
<body>
<header><h1>⚽ THE THAO 24H</h1><p>Bóng Đá • Thể Thao • Tin Tức • Tài Chính</p><p id="update" style="font-size:12px;margin-top:6px">Đang thử tải tin mới nhất...</p></header>
<div class="tabs">
<button class="active" onclick="loc('all',this)">🏠 Tất Cả</button>
<button onclick="loc('BÓNG ĐÁ',this)">⚽ Bóng Đá</button>
<button onclick="loc('THỂ THAO',this)">🏆 Thể Thao</button>
<button onclick="loc('KINH DOANH',this)">💰 Tài Chính</button>
</div>
<div class="list" id="list"></div>
<script>
let allNews=[
{cat:'BÓNG ĐÁ',title:'Man City thắng kịch tính 3-2 ở phút bù giờ, giữ vững ngôi đầu',desc:'Trận đấu rượt đuổi tỷ số hấp dẫn nhất vòng đấu, Haaland lập cú đúp quyết định.',link:'https://www.google.com/search?q=Man+City+thắng+3-2',img:'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=600',date:'Tin nổi bật'},
{cat:'BÓNG ĐÁ',title:'Real Madrid công bố bản hợp đồng bom tấn mùa hè',desc:'Đội bóng Hoàng gia chính thức chiêu mộ ngôi sao trẻ được săn đón nhất châu Âu.',link:'https://www.google.com/search?q=Real+Madrid+hợp+đồng+bom+tấn',img:'https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=600',date:'Tin nổi bật'},
{cat:'THỂ THAO',title:'Việt Nam giành HCV SEA Games sau 10 năm chờ đợi',desc:'Vận động viên Việt Nam phá kỷ lục quốc gia, mang về tấm huy chương vàng quý giá.',link:'https://www.google.com/search?q=Việt+Nam+giành+HCV+SEA+Games',img:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600',date:'Tin nổi bật'},
{cat:'KINH DOANH',title:'Giá vàng hôm nay tăng mạnh, lập đỉnh mới',desc:'Giá vàng trong nước tăng 500.000 đồng/lượng, nhà đầu tư đổ xô đi mua.',link:'https://www.google.com/search?q=Giá+vàng+hôm+nay',img:'https://images.unsplash.com/photo-1610375461246-83df859d849d?w=600',date:'Tin nổi bật'},
{cat:'BÓNG ĐÁ',title:'Đội tuyển Việt Nam thắng 2-0, vào bán kết AFF Cup',desc:'Hai bàn thắng đẹp mắt giúp Việt Nam giành vé sớm vào vòng trong.',link:'https://www.google.com/search?q=Đội+tuyển+Việt+Nam+vào+bán+kết',img:'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600',date:'Tin nổi bật'},
{cat:'KINH DOANH',title:'Chứng khoán tăng điểm mạnh, VN-Index vượt 1.300',desc:'Thị trường khởi sắc nhờ nhóm cổ phiếu ngân hàng và bất động sản dẫn dắt.',link:'https://www.google.com/search?q=VN-Index+vượt+1300',img:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600',date:'Tin nổi bật'}
];
function render(list){
document.getElementById('list').innerHTML=list.map(n=>`<a class="card" data-cat="${n.cat}" href="${n.link}" target="_blank"><img src="${n.img}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600'"><div><div class="tag">${n.cat}</div><h3>${n.title}</h3><p>${n.desc}</p><div class="time">${n.date} • Bấm để đọc→</div></div></a>`).join('');
}
function loc(cat,btn){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render(cat==='all'?allNews:allNews.filter(n=>n.cat===cat));
}
// 1. Hiện tin cũ ngay, không đợi
render(allNews);
// 2. Thử tải tin mới ở phía sau, được thì thay, không được thì giữ tin cũ
async function loadNew(){
try{
const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://vnexpress.net/rss/the-thao.rss'));
const d=await r.json();
if(!d.items||d.items.length===0) return;
let fresh=d.items.slice(0,10).map(it=>({cat:'THỂ THAO',title:it.title,desc:(it.description'').replace(/<[^>]*>/g,'').slice(0,140)+'...',link:it.link,img:it.thumbnail'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600',date:new Date(it.pubDate).toLocaleString('vi-VN')}));
allNews=fresh;
document.getElementById('update').textContent='Đã cập nhật tin mới lúc: '+new Date().toLocaleString('vi-VN');
render(allNews);
}catch(e){
document.getElementById('update').textContent='Đang hiện tin nổi bật - Bấm F5 để thử tải tin mới';
}
}
loadNew();
</script>
</body>
</html>
